<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>舞鶴高専 サービス稼働状況モニター</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-alt: #273449;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --ok: #22c55e;
      --ok-bg: rgba(34, 197, 94, 0.14);
      --err: #ef4444;
      --err-bg: rgba(239, 68, 68, 0.14);
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.14);
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px 48px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.875rem;
    }

    button.refresh-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.refresh-btn:hover {
      background: var(--surface-alt);
    }

    .banner {
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      font-weight: 600;
    }

    .banner.ok {
      border-color: rgba(34, 197, 94, 0.4);
      background: var(--ok-bg);
      color: #86efac;
    }

    .banner.err {
      border-color: rgba(239, 68, 68, 0.45);
      background: var(--err-bg);
      color: #fca5a5;
    }

    .banner.warn {
      border-color: rgba(245, 158, 11, 0.4);
      background: var(--warn-bg);
      color: #fcd34d;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .dot.err { background: var(--err); box-shadow: 0 0 8px var(--err); }
    .dot.warn { background: var(--warn); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .card-url {
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }

    .card-url:hover {
      text-decoration: underline;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.ok { background: var(--ok-bg); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.35); }
    .badge.err { background: var(--err-bg); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge.warn { background: var(--warn-bg); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--bg);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .stat-value {
      font-size: 0.98rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .chart-wrap {
      position: relative;
      background: var(--bg);
      border-radius: 8px;
      padding: 10px 10px 6px;
    }

    .chart-caption {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    svg.sparkline {
      width: 100%;
      height: 110px;
      display: block;
      overflow: visible;
    }

    .tooltip {
      position: fixed;
      pointer-events: none;
      background: #020617;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      z-index: 100;
      display: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.8rem;
      background: rgba(15, 23, 42, 0.45);
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .empty-state {
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }

    .mono {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>舞鶴高専 サービス稼働状況モニター</h1>
      <div class="meta">
        <span id="last-updated">読み込み中...</span>
        <button class="refresh-btn" onclick="loadStatus()">更新</button>
      </div>
    </header>

    <div id="overall-banner" class="banner warn">
      <span class="dot warn"></span>
      <span>監視データを確認しています...</span>
    </div>

    <div id="cards-grid" class="grid"></div>

    <h2 class="section-title">インシデント発生ログ</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>状態</th>
            <th>対象サービス</th>
            <th>開始時刻</th>
            <th>終了時刻</th>
            <th>継続時間</th>
            <th>原因</th>
          </tr>
        </thead>
        <tbody id="incidents-body">
          <tr><td colspan="6" class="empty-state">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="tooltip" class="tooltip"></div>

  <script>
    const tooltip = document.getElementById('tooltip');

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatDateTime(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      });
    }

    function formatTimeShort(iso) {
      const d = new Date(iso);
      return d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    }

    function formatDuration(startIso, endIso) {
      const start = new Date(startIso).getTime();
      const end = endIso ? new Date(endIso).getTime() : Date.now();
      const diffSec = Math.max(0, Math.floor((end - start) / 1000));
      const h = Math.floor(diffSec / 3600);
      const m = Math.floor((diffSec % 3600) / 60);
      const s = diffSec % 60;
      const parts = [];
      if (h > 0) parts.push(`${h}時間`);
      if (m > 0 || h > 0) parts.push(`${m}分`);
      parts.push(`${s}秒`);
      return parts.join(' ');
    }

    function renderChart(pings) {
      if (!pings || pings.length === 0) {
        return `<div class="empty-state" style="padding:24px 0;font-size:0.8rem;">過去12時間のデータがありません</div>`;
      }

      const W = 400;
      const H = 100;
      const padX = 6;
      const padY = 10;
      const innerW = W - padX * 2;
      const innerH = H - padY * 2;

      const validLatencies = pings.filter(p => p.success && p.latency_ms != null).map(p => p.latency_ms);
      const maxLat = Math.max(100, ...(validLatencies.length ? validLatencies : [100]));

      const xFor = (i) => pings.length === 1 ? padX + innerW / 2 : padX + (i / (pings.length - 1)) * innerW;
      const yFor = (ms) => padY + innerH - Math.min(1, ms / maxLat) * innerH;

      let pathSegments = [];
      let currentSegment = [];
      pings.forEach((p, i) => {
        if (p.success && p.latency_ms != null) {
          currentSegment.push(`${xFor(i).toFixed(1)},${yFor(p.latency_ms).toFixed(1)}`);
        } else {
          if (currentSegment.length > 0) {
            pathSegments.push(currentSegment);
            currentSegment = [];
          }
        }
      });
      if (currentSegment.length > 0) pathSegments.push(currentSegment);

      const linesSvg = pathSegments
        .map(seg => `<polyline fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${seg.join(' ')}" />`)
        .join('');

      const pointsSvg = pings.map((p, i) => {
        const cx = xFor(i).toFixed(1);
        const cy = p.success && p.latency_ms != null ? yFor(p.latency_ms).toFixed(1) : (H - padY).toFixed(1);
        const color = p.success ? '#38bdf8' : '#ef4444';
        const radius = p.success ? (pings.length > 80 ? 2 : 3) : 4;
        const detail = p.success
          ? `${formatDateTime(p.checked_at)} | ${p.latency_ms} ms (HTTP ${p.status_code ?? '-'})`
          : `${formatDateTime(p.checked_at)} | 障害: ${p.error_message ?? '接続失敗'}`;
        return `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="${color}" data-tip="${escapeHtml(detail)}" />`;
      }).join('');

      return `
        <div class="chart-caption">
          <span>${formatTimeShort(pings[0].checked_at)}</span>
          <span>最大 ${maxLat} ms (過去12時間 / ${pings.length}件)</span>
          <span>${formatTimeShort(pings[pings.length - 1].checked_at)}</span>
        </div>
        <svg class="sparkline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <line x1="${padX}" y1="${H - padY}" x2="${W - padX}" y2="${H - padY}" stroke="#334155" stroke-width="1" />
          ${linesSvg}
          ${pointsSvg}
        </svg>
      `;
    }

    function attachTooltips() {
      document.querySelectorAll('svg.sparkline circle[data-tip]').forEach(el => {
        el.addEventListener('mouseenter', (e) => {
          tooltip.textContent = el.getAttribute('data-tip');
          tooltip.style.display = 'block';
        });
        el.addEventListener('mousemove', (e) => {
          tooltip.style.left = `${e.clientX + 12}px`;
          tooltip.style.top = `${e.clientY - 28}px`;
        });
        el.addEventListener('mouseleave', () => {
          tooltip.style.display = 'none';
        });
      });
    }

    async function loadStatus() {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        document.getElementById('last-updated').textContent =
          `最終更新: ${formatDateTime(data.generated_at)} (${data.interval_secs}秒間隔)`;

        const banner = document.getElementById('overall-banner');
        const hasAnyData = data.targets.some(t => t.latest_ping != null);
        const failingTargets = data.targets.filter(t => t.latest_ping && !t.latest_ping.success);

        if (!hasAnyData) {
          banner.className = 'banner warn';
          banner.innerHTML = `<span class="dot warn"></span><span>初回の疎通確認を実行中です...</span>`;
        } else if (failingTargets.length > 0) {
          const names = failingTargets.map(t => t.name).join('、');
          banner.className = 'banner err';
          banner.innerHTML = `<span class="dot err"></span><span>一部サービスで障害が発生しています (${escapeHtml(names)})</span>`;
        } else {
          banner.className = 'banner ok';
          banner.innerHTML = `<span class="dot ok"></span><span>すべての監視対象サービスは正常に稼働しています</span>`;
        }

        const grid = document.getElementById('cards-grid');
        grid.innerHTML = data.targets.map(t => {
          const latest = t.latest_ping;
          let badgeClass = 'warn';
          let badgeText = '未計測';
          if (latest) {
            badgeClass = latest.success ? 'ok' : 'err';
            badgeText = latest.success ? '正常' : '障害発生中';
          }

          const latestMs = latest && latest.latency_ms != null ? `${latest.latency_ms} ms` : '—';
          const avgMs = t.avg_latency_12h_ms != null ? `${Math.round(t.avg_latency_12h_ms)} ms` : '—';
          const uptime = t.uptime_12h_pct != null ? `${t.uptime_12h_pct.toFixed(1)}%` : '—';

          return `
            <div class="card">
              <div class="card-header">
                <div>
                  <div class="card-title">${escapeHtml(t.name)}</div>
                  <a class="card-url" href="${escapeHtml(t.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(t.url)}</a>
                </div>
                <span class="badge ${badgeClass}">${badgeText}</span>
              </div>
              <div class="stats">
                <div>
                  <div class="stat-label">最新 Ping</div>
                  <div class="stat-value">${latestMs}</div>
                </div>
                <div>
                  <div class="stat-label">12時間平均</div>
                  <div class="stat-value">${avgMs}</div>
                </div>
                <div>
                  <div class="stat-label">12時間稼働率</div>
                  <div class="stat-value">${uptime}</div>
                </div>
              </div>
              <div class="chart-wrap">
                ${renderChart(t.pings_12h)}
              </div>
            </div>
          `;
        }).join('');

        attachTooltips();

        const tbody = document.getElementById('incidents-body');
        if (!data.incidents || data.incidents.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="empty-state">これまでに記録されたインシデントはありません</td></tr>`;
        } else {
          tbody.innerHTML = data.incidents.map(inc => {
            const ongoing = inc.ended_at == null;
            const badge = ongoing
              ? `<span class="badge err">発生中</span>`
              : `<span class="badge ok">復旧済み</span>`;
            const endedText = ongoing ? '<span style="color:#fca5a5;">継続中</span>' : formatDateTime(inc.ended_at);
            return `
              <tr>
                <td>${badge}</td>
                <td>
                  <div>${escapeHtml(inc.target_name)}</div>
                  <div style="font-size:0.75rem;color:var(--muted);">${escapeHtml(inc.target)}</div>
                </td>
                <td class="mono">${formatDateTime(inc.started_at)}</td>
                <td class="mono">${endedText}</td>
                <td class="mono">${formatDuration(inc.started_at, inc.ended_at)}</td>
                <td>${escapeHtml(inc.cause)}</td>
              </tr>
            `;
          }).join('');
        }
      } catch (err) {
        console.error(err);
      }
    }

    loadStatus();
    setInterval(loadStatus, 30000);
  </script>
</body>
</html>
